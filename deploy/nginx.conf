map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    '' $scheme;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 55m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 180s;
    }
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }
    location /static/ { proxy_pass http://api:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_scheme; }
    location /assets/ { expires 30d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
